<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <header>
        <nav class="max-w-300 p-5 lg:p-10 m-auto flex items-center justify-between">

                <p class="text-[#7EB693]">Home</p>
                <p class="text-[#274C5B]">About Us</p>
                <p class="text-[#274C5B]">Shop</p>

                <p class="text-[#274C5B]">Contact Us</p>
